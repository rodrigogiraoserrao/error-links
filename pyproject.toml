[project]
name = "error-links"
version = "0.3.0"
description = "Adds helpful links to the REPL when an exception happens."
readme = "README.md"
authors = [
    { name = "Rodrigo Girão Serrão", email = "rodrigo@mathspp.com" }
]
requires-python = ">=3.11"
dependencies = [
    "rich>=15.0.0",
]

[project.scripts]
error-links = "error_links.__main__:run"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
